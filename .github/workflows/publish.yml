name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so the images pick up Postgres patch releases and Alpine fixes.
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for the test
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg }}
          tags: pg-backup:test
          load: true

      - name: Round-trip test
        run: test/roundtrip.sh
        env:
          PG_MAJOR: ${{ matrix.pg }}
          IMAGE: pg-backup:test

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.event_name != 'pull_request'
        name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: PG_MAJOR=${{ matrix.pg }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pg-backup:${{ matrix.pg }}
            ghcr.io/${{ github.repository_owner }}/pg-backup:${{ matrix.pg }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Encrypted Postgres ${{ matrix.pg }} backups with hourly, daily, weekly and monthly retention
